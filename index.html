<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertisseur de devise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Convertisseur de devise</h1>
    <form>
      <label for="montant">Montant :</label>
      <input type="number" id="montant" placeholder="Entrez le montant">
      <label for="devise-depart">Devise de départ :</label>
      <select id="devise-depart">
        <option value="XOF">Francs CFA</option>
        <option value="EUR">Euro</option>
        <option value="USD">Dollar</option>
      </select>
      <label for="devise-arrivee">Devise d'arrivée :</label>
      <select id="devise-arrivee">
        <option value="XOF">Francs CFA</option>
        <option value="EUR">Euro</option>
        <option value="USD">Dollar</option>
      </select>
      <button id="convertir">Convertir</button>
      <p id="resultat"></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
<style>

body {
  font-family: Arial, sans-serif;
}

.container {
  max-width: 400px;

  padding: 20px;

  border: 1px solid #ccc;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

h1 {
  text-align: center;
}

label {

  margin-bottom: 10px;
}

input[type="number"] {

  padding: 10px;

}

select {

  height: 40px;
  margin-bottom: 20px;
  padding: 10px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  height: 40px;
  background-color: #4CAF50;
  color: #fff;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background-color: #3e8e41;
}

#resultat {
  font-size: 24px;
  font-weight: bold;
  text-align: center;
  margin-top: 20px;
}
</style>
